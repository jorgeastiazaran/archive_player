/**
 * Contratos de datos centrales de Archive Player.
 * Compartidos entre la capa de UI (Web/Móvil), los proveedores de datos (archive.org),
 * el generador de playlists con IA y el gestor de descargas offline.
 */

type MediaType = 'audio' | 'video';

type ArchiveSource =
  | 'internet_archive'
  | 'fma'
  | 'musopen'
  | 'imslp'
  | 'open_music_archive'
  | 'public_domain_review'
  | 'nfb';

type LicenseCode = 'PUBLIC_DOMAIN' | 'CC0' | 'CC-BY' | 'CC-BY-SA' | 'CC-BY-NC';

interface LicenseInfo {
  code: LicenseCode;
  label: string;
  url?: string;
  attributionText: string;
}

interface MediaItem {
  id: string;
  archiveIdentifier: string;
  title: string;
  artist: string;
  albumOrCollection: string;
  mediaType: MediaType;
  streamUrl: string;
  downloadUrl: string;
  thumbnailUrl: string;
  durationSeconds?: number;
  year?: number;
  decade: string;
  genres: string[];
  moods: string[];
  region?: string;
  source: ArchiveSource;
  sourceLabel: string;
  sourcePageUrl: string;
  license: LicenseInfo;
  historicalContext: string;
}

interface AIPlaylistPrompt {
  era: string;
  genre: string;
  artistType?: string;
  locationOrWeather: string;
  mood?: string;
  mediaFilter: 'all' | 'audio' | 'video';
  customPrompt?: string;
}

interface Playlist {
  id: string;
  name: string;
  description: string;
  coverUrl?: string;
  createdAt: string;
  isAiGenerated: boolean;
  aiPrompt?: AIPlaylistPrompt;
  aiReasoning?: Record<string, string>; // Explicación de la IA por cada item.id
  items: MediaItem[];
}

interface OfflineMediaRecord {
  item: MediaItem;
  downloadedAt: string;
  sizeBytes: number;
}

type AppView =
  | 'explore'
  | 'artists'
  | 'albums'
  | 'videos'
  | 'ai-curator'
  | 'playlists'
  | 'favorites'
  | 'offline';

interface PlayerContextValue {
  // Catálogo e ítems
  catalog: MediaItem[];
  currentItem: MediaItem | null;
  queue: MediaItem[];
  isPlaying: boolean;
  currentTime: number;
  duration: number;
  volume: number;
  isMuted: boolean;
  isShuffle: boolean;
  repeatMode: 'off' | 'all' | 'one';
  // Modos especiales de visualización y contexto
  showLinerNotes: boolean;
  showVideoOverlay: boolean;
  silentFilmVisualizer: boolean;
  audioOnlyMode: boolean;
  // Acciones de reproducción
  playItem: (item: MediaItem, newQueue?: MediaItem[]) => void;
  togglePlay: () => void;
  nextTrack: () => void;
  prevTrack: () => void;
  seekTo: (seconds: number) => void;
  setVolume: (vol: number) => void;
  toggleMute: () => void;
  toggleShuffle: () => void;
  cycleRepeatMode: () => void;
  setShowLinerNotes: (show: boolean) => void;
  setShowVideoOverlay: (show: boolean) => void;
  setSilentFilmVisualizer: (enabled: boolean) => void;
  setAudioOnlyMode: (enabled: boolean) => void;
  // Biblioteca personal (Favoritos y Playlists)
  favoriteIds: string[];
  toggleFavorite: (item: MediaItem) => void;
  isFavorite: (id: string) => boolean;
  playlists: Playlist[];
  createPlaylist: (name: string, description: string, initialItems?: MediaItem[], aiMeta?: { isAiGenerated?: boolean; aiPrompt?: AIPlaylistPrompt; aiReasoning?: Record<string, string> }) => Playlist;
  deletePlaylist: (playlistId: string) => void;
  addItemToPlaylist: (playlistId: string, item: MediaItem) => void;
  removeItemFromPlaylist: (playlistId: string, itemId: string) => void;
  playPlaylist: (playlist: Playlist) => void;
  // Modo Offline y Descargas
  offlineRecords: OfflineMediaRecord[];
  downloadingIds: string[];
  isOfflineDownloaded: (id: string) => boolean;
  downloadForOffline: (item: MediaItem) => Promise<void>;
  removeOfflineDownload: (id: string) => Promise<void>;
  getEffectiveStreamUrl: (item: MediaItem) => Promise<string>;
  isOnline: boolean;
}

interface ArchiveSearchDoc {
  identifier: string;
  title?: string;
  creator?: string | string[];
  year?: number | string;
  mediatype?: string;
  description?: string | string[];
  licenseurl?: string;
  collection?: string | string[];
}

interface ArchiveSearchResponse {
  response?: {
    docs?: ArchiveSearchDoc[];
  };
}

interface ArchiveMetadataFile {
  name: string;
  format?: string;
  title?: string;
  track?: string;
  length?: string;
  source?: string;
}

interface ArchiveItemMetadata {
  identifier?: string;
  title?: string;
  creator?: string | string[];
  year?: string | number;
  date?: string;
  mediatype?: string;
  description?: string | string[];
  licenseurl?: string;
  collection?: string | string[];
}

interface ArchiveMetadataResponse {
  metadata?: ArchiveItemMetadata;
  files?: ArchiveMetadataFile[];
}

/**
 * Codifica cada segmento de un nombre de archivo de archive.org respetando posibles subdirectorios.
 */
function encodeArchiveFilePath(fileName: string): string {
  return fileName
    .split('/')
    .map((segment) => encodeURIComponent(segment))
    .join('/');
}

/**
 * Normaliza el campo `creator` o `description` que archive.org puede devolver como string o arreglo.
 */
function normalizeTextField(value: string | string[] | undefined, fallback: string): string {
  if (!value) return fallback;
  if (Array.isArray(value)) {
    const joined = value.filter(Boolean).join(', ').trim();
    return joined || fallback;
  }
  const trimmed = String(value).trim();
  return trimmed || fallback;
}

/**
 * Limpia etiquetas HTML básicas presentes en las descripciones de Internet Archive.
 */
function stripHtmlTags(raw: string): string {
  return raw
    .replace(/<[^>]+>/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * Convierte duraciones de archive.org ("03:24", "1:02:15" o "204.5") a segundos enteros.
 */
function parseDurationSeconds(lengthStr?: string): number | undefined {
  if (!lengthStr) return undefined;
  const trimmed = lengthStr.trim();
  if (/^\d+(\.\d+)?$/.test(trimmed)) {
    return Math.round( parseFloat(trimmed) );
  }
  const parts = trimmed.split(':').map((part) => parseFloat(part));
  if (parts.some((n) => Number.isNaN(n))) return undefined;
  if (parts.length === 2) {
    return Math.round(parts[0] * 60 + parts[1]);
  }
  if (parts.length === 3) {
    return Math.round(parts[0] * 3600 + parts[1] * 60 + parts[2]);
  }
  return undefined;
}

/**
 * Extrae el año numérico y la década (ej. "1920s") a partir de `year` o `date`.
 */
function parseYearAndDecade(rawYear?: string | number, rawDate?: string): { year?: number; decade: string } {
  const candidate = rawYear ?? rawDate;
  if (candidate !== undefined) {
    const match = String(candidate).match(/\b(1[6-9]\d{2}|20\d{2})\b/);
    if (match) {
      const parsedYear = parseInt(match[1], 10);
      const decadeStart = Math.floor(parsedYear / 10) * 10;
      return { year: parsedYear, decade: `${decadeStart}s` };
    }
  }
  return { year: undefined, decade: 'Clásico' };
}

/**
 * Detecta la fuente curada según las colecciones de Internet Archive.
 */
function resolveArchiveSource(collections?: string | string[]): { source: ArchiveSource; sourceLabel: string } {
  const list = Array.isArray(collections)
    ? collections.map((c) => c.toLowerCase())
    : collections
    ? [collections.toLowerCase()]
    : [];

  if (list.some((c) => c.includes('freemusicarchive') || c.includes('fma'))) {
    return { source: 'fma', sourceLabel: 'Free Music Archive' };
  }
  if (list.some((c) => c.includes('musopen'))) {
    return { source: 'musopen', sourceLabel: 'Musopen (via Archive)' };
  }
  if (list.some((c) => c.includes('imslp'))) {
    return { source: 'imslp', sourceLabel: 'IMSLP (via Archive)' };
  }
  if (list.some((c) => c.includes('78rpm') || c.includes('georgeblood'))) {
    return { source: 'open_music_archive', sourceLabel: 'Great 78 Project / Archive' };
  }
  if (list.some((c) => c.includes('prelinger') || c.includes('nfb'))) {
    return { source: 'nfb', sourceLabel: 'Prelinger / NFB Archive' };
  }
  if (list.some((c) => c.includes('silent_films') || c.includes('publicdomain'))) {
    return { source: 'public_domain_review', sourceLabel: 'Public Domain Cinema' };
  }
  return { source: 'internet_archive', sourceLabel: 'Internet Archive' };
}

/**
 * Normaliza la URL de licencia de archive.org al contrato `LicenseInfo`.
 */
function normalizeLicense(licenseUrl: string | undefined, title: string, artist: string): LicenseInfo {
  const lower = (licenseUrl || '').toLowerCase();

  if (lower.includes('zero/1.0') || lower.includes('cc0')) {
    return {
      code: 'CC0',
      label: 'Dominio Público (CC0 1.0)',
      url: licenseUrl || 'https://creativecommons.org/publicdomain/zero/1.0/',
      attributionText: `${title} — ${artist}. Dedicado al Dominio Público (CC0 1.0) vía Internet Archive.`,
    };
  }
  if (lower.includes('publicdomain')) {
    return {
      code: 'PUBLIC_DOMAIN',
      label: 'Dominio Público (PDM 1.0)',
      url: licenseUrl || 'https://creativecommons.org/publicdomain/mark/1.0/',
      attributionText: `${title} — ${artist}. Obra en el Dominio Público preservada por Internet Archive.`,
    };
  }
  if (lower.includes('by-nc')) {
    return {
      code: 'CC-BY-NC',
      label: 'Creative Commons BY-NC',
      url: licenseUrl,
      attributionText: `"${title}" por ${artist}. Licencia Creative Commons Reconocimiento-NoComercial (${licenseUrl}) vía Internet Archive.`,
    };
  }
  if (lower.includes('by-sa')) {
    return {
      code: 'CC-BY-SA',
      label: 'Creative Commons BY-SA',
      url: licenseUrl,
      attributionText: `"${title}" por ${artist}. Licencia Creative Commons Reconocimiento-CompartirIgual (${licenseUrl}) vía Internet Archive.`,
    };
  }
  if (lower.includes('by/')) {
    return {
      code: 'CC-BY',
      label: 'Creative Commons BY',
      url: licenseUrl,
      attributionText: `"${title}" por ${artist}. Licencia Creative Commons Reconocimiento (${licenseUrl}) vía Internet Archive.`,
    };
  }

  return {
    code: 'PUBLIC_DOMAIN',
    label: 'Archivo Abierto / Dominio Público',
    url: licenseUrl || 'https://archive.org/about/terms.php',
    attributionText: `${title} — ${artist}. Preservado y distribuido abiertamente por Internet Archive (archive.org).`,
  };
}

/**
 * Filtra coincidencias locales en `CURATED_CATALOG` para respuesta inmediata o respaldo.
 */
function filterCuratedCatalog(
  query: string,
  mediaFilter: 'all' | 'audio' | 'video'
): MediaItem[] {
  const normalizedQuery = query.trim().toLowerCase();
  const terms = normalizedQuery.split(/\s+/).filter(Boolean);

  return CURATED_CATALOG.filter((item) => {
    if (mediaFilter !== 'all' && item.mediaType !== mediaFilter) {
      return false;
    }
    if (terms.length === 0) return true;

    const haystack = [
      item.title,
      item.artist,
      item.albumOrCollection,
      item.decade,
      item.region || '',
      item.historicalContext,
      ...item.genres,
      ...item.moods,
    ]
      .join(' ')
      .toLowerCase();

    return terms.some((term) => haystack.includes(term));
  });
}

/**
 * Consulta `https://archive.org/metadata/{identifier}` y extrae todas las pistas `.mp3`
 * o videos `.mp4` de ese álbum u obra como un arreglo normalizado de `MediaItem[]`.
 */
async function fetchArchiveItemTracks(identifier: string): Promise<MediaItem[]> {
  const cleanId = identifier.trim();
  if (!cleanId) return [];

  try {
    const endpoint = `https://archive.org/metadata/${encodeURIComponent(cleanId)}`;
    const response = await fetch(endpoint);
    if (!response.ok) {
      throw new Error(`Error HTTP ${response.status} al obtener metadata de ${cleanId}`);
    }

    const data = (await response.json()) as ArchiveMetadataResponse;
    const meta = data.metadata || {};
    const files = data.files || [];

    const itemTitle = meta.title || cleanId;
    const artist = normalizeTextField(meta.creator, 'Artista de Archivo');
    const rawDescription = normalizeTextField(
      meta.description,
      `Registro histórico preservado en Internet Archive bajo el identificador "${cleanId}".`
    );
    const cleanedDescription = stripHtmlTags(rawDescription).slice(0, 420);
    const { year, decade } = parseYearAndDecade(meta.year, meta.date);
    const { source, sourceLabel } = resolveArchiveSource(meta.collection);
    const thumbnailUrl = `https://archive.org/services/img/${encodeURIComponent(cleanId)}`;
    const sourcePageUrl = `https://archive.org/details/${encodeURIComponent(cleanId)}`;

    const isMovieMediatype =
      meta.mediatype === 'movies' ||
      meta.mediatype === 'video';

    // 1. Filtrar archivos de video MP4 compatibles con HTML5 <video>
    const allMp4Files = files.filter((f) => f.name && f.name.toLowerCase().endsWith('.mp4'));
    const preferredMp4Files = allMp4Files.filter((f) => !f.name.toLowerCase().includes('.ia.mp4'));
    const videoFiles = preferredMp4Files.length > 0 ? preferredMp4Files : allMp4Files;

    // 2. Filtrar archivos de audio MP3 (evitando duplicados _vbr.mp3 si existen originales)
    const allMp3Files = files.filter((f) => f.name && f.name.toLowerCase().endsWith('.mp3'));
    const nonVbrMp3Files = allMp3Files.filter((f) => !f.name.toLowerCase().endsWith('_vbr.mp3'));
    const audioFiles = nonVbrMp3Files.length > 0 ? nonVbrMp3Files : allMp3Files;

    const results: MediaItem[] = [];

    if (isMovieMediatype && videoFiles.length > 0) {
      // Para películas/cortos, priorizar el archivo _512kb.mp4 o el primer MP4 reproducible
      const bestVideo =
        videoFiles.find((f) => f.name.toLowerCase().includes('512kb.mp4')) || videoFiles[0];
      const fileUrl = `https://archive.org/download/${encodeURIComponent(cleanId)}/${encodeArchiveFilePath(bestVideo.name)}`;
      const trackTitle = bestVideo.title || itemTitle;

      results.push({
        id: `ia-video-${cleanId}`,
        archiveIdentifier: cleanId,
        title: trackTitle,
        artist,
        albumOrCollection: itemTitle,
        mediaType: 'video',
        streamUrl: fileUrl,
        downloadUrl: fileUrl,
        thumbnailUrl,
        durationSeconds: parseDurationSeconds(bestVideo.length),
        year,
        decade,
        genres: ['Cine de Archivo', 'Dominio Público'],
        moods: ['Clásico', 'Vintage'],
        source,
        sourceLabel,
        sourcePageUrl,
        license: normalizeLicense(meta.licenseurl, trackTitle, artist),
        historicalContext: cleanedDescription,
      });

      return results;
    }

    if (audioFiles.length > 0) {
      audioFiles.slice(0, 24).forEach((file, index) => {
        const fileUrl = `https://archive.org/download/${encodeURIComponent(cleanId)}/${encodeArchiveFilePath(file.name)}`;
        const cleanFileName = file.name
          .split('/')
          .pop()
          ?.replace(/\.mp3$/i, '')
          .replace(/[_-]+/g, ' ')
          .trim();
        const trackTitle = file.title || cleanFileName || `${itemTitle} (Pista ${index + 1})`;

        results.push({
          id: `ia-audio-${cleanId}-${index}`,
          archiveIdentifier: cleanId,
          title: trackTitle,
          artist,
          albumOrCollection: itemTitle,
          mediaType: 'audio',
          streamUrl: fileUrl,
          downloadUrl: fileUrl,
          thumbnailUrl,
          durationSeconds: parseDurationSeconds(file.length),
          year,
          decade,
          genres: ['Archivo Sonoro', sourceLabel],
          moods: ['Enfoque', 'Clásico'],
          source,
          sourceLabel,
          sourcePageUrl,
          license: normalizeLicense(meta.licenseurl, trackTitle, artist),
          historicalContext: cleanedDescription,
        });
      });

      return results;
    }

    // Si no era mediatype movies pero sí tiene archivos MP4
    if (videoFiles.length > 0) {
      const bestVideo = videoFiles[0];
      const fileUrl = `https://archive.org/download/${encodeURIComponent(cleanId)}/${encodeArchiveFilePath(bestVideo.name)}`;
      const trackTitle = bestVideo.title || itemTitle;

      results.push({
        id: `ia-video-${cleanId}`,
        archiveIdentifier: cleanId,
        title: trackTitle,
        artist,
        albumOrCollection: itemTitle,
        mediaType: 'video',
        streamUrl: fileUrl,
        downloadUrl: fileUrl,
        thumbnailUrl,
        durationSeconds: parseDurationSeconds(bestVideo.length),
        year,
        decade,
        genres: ['Video de Archivo'],
        moods: ['Curioso', 'Vintage'],
        source,
        sourceLabel,
        sourcePageUrl,
        license: normalizeLicense(meta.licenseurl, trackTitle, artist),
        historicalContext: cleanedDescription,
      });
    }

    return results;
  } catch {
    // Fallback resiliente si falla la red: buscar coincidencia en el catálogo curado
    return CURATED_CATALOG.filter(
      (item) => item.archiveIdentifier.toLowerCase() === cleanId.toLowerCase()
    );
  }
}

/**
 * Construye una expresión de búsqueda avanzada para `advancedsearch.php` siguiendo la guía archive-api.
 */
function buildAdvancedSearchQuery(
  query: string,
  mediaFilter: 'all' | 'audio' | 'video'
): string {
  const sanitized = query.replace(/[()"']/g, ' ').trim();
  const audioClause =
    'mediatype:(audio) AND (collection:(freemusicarchive) OR collection:(78rpm) OR collection:(musopen) OR collection:(audio_music) OR collection:(opensource_audio))';
  const videoClause =
    'mediatype:(movies) AND (collection:(feature_films) OR collection:(silent_films) OR collection:(animationandcartoons) OR collection:(prelinger))';

  const typeClause =
    mediaFilter === 'audio'
      ? `(${audioClause})`
      : mediaFilter === 'video'
      ? `(${videoClause})`
      : `((${audioClause}) OR (${videoClause}))`;

  if (!sanitized) {
    return typeClause;
  }

  return `${typeClause} AND (${sanitized})`;
}

/**
 * Busca obras de audio y/o video en `https://archive.org/advancedsearch.php`,
 * resolviendo sus archivos reproducibles reales (`.mp3` / `.mp4`) y combinando
 * coincidencias de `CURATED_CATALOG` para ofrecer velocidad y resiliencia ante fallos de red.
 */
async function searchArchiveMedia(
  query: string,
  mediaFilter: 'all' | 'audio' | 'video' = 'all',
  limit = 16
): Promise<MediaItem[]> {
  const curatedMatches = filterCuratedCatalog(query, mediaFilter);

  // Si la consulta está vacía y tenemos suficientes ítems curados, devolvemos de inmediato si se pide pocos
  const fullQuery = buildAdvancedSearchQuery(query, mediaFilter);
  const rowsToFetch = Math.min(Math.max(limit, 10), 20);

  const params = new URLSearchParams({
    q: fullQuery,
    output: 'json',
    rows: String(rowsToFetch),
    page: '1',
  });

  const fields = [
    'identifier',
    'title',
    'creator',
    'year',
    'mediatype',
    'description',
    'licenseurl',
    'collection',
  ];
  fields.forEach((field) => params.append('fl[]', field));
  params.append('sort[]', 'downloads desc');

  try {
    const response = await fetch(`https://archive.org/advancedsearch.php?${params.toString()}`);
    if (!response.ok) {
      throw new Error(`Error HTTP ${response.status} al consultar advancedsearch.php`);
    }

    const data = (await response.json()) as ArchiveSearchResponse;
    const docs = data.response?.docs ?? [];

    // Resolver en paralelo los primeros documentos para obtener sus pistas .mp3 o .mp4 verificadas
    const docsToResolve = docs.slice(0, Math.min(docs.length, 8));
    const resolvedTracksSettled = await Promise.allSettled(
      docsToResolve.map(async (doc): Promise<MediaItem | null> => {
        const tracks = await fetchArchiveItemTracks(doc.identifier);
        if (tracks.length > 0) {
          const primaryTrack = tracks[0];
          const mediaType: MediaType = doc.mediatype === 'movies' ? 'video' : primaryTrack.mediaType;
          return {
            ...primaryTrack,
            title: doc.title || primaryTrack.title,
            mediaType,
          };
        }
        return null;
      })
    );

    const remoteItems: MediaItem[] = [];
    for (const outcome of resolvedTracksSettled) {
      if (outcome.status === 'fulfilled' && outcome.value !== null) {
        remoteItems.push(outcome.value);
      }
    }

    // Combinar coincidencias curadas y resultados en vivo de archive.org sin duplicar archiveIdentifier
    const seenIdentifiers = new Set<string>();
    const combined: MediaItem[] = [];

    for (const item of [...curatedMatches, ...remoteItems]) {
      const key = item.archiveIdentifier.toLowerCase();
      if (!seenIdentifiers.has(key)) {
        seenIdentifiers.add(key);
        combined.push(item);
      }
      if (combined.length >= limit) break;
    }

    if (combined.length > 0) {
      return combined.slice(0, limit);
    }

    // Si la búsqueda no arrojó coincidencias exactas, devolver respaldo del catálogo filtrado por tipo
    return filterCuratedCatalog('', mediaFilter).slice(0, limit);
  } catch {
    // Resiliencia total offline / fallo de API: retornar coincidencias del catálogo curado local
    if (curatedMatches.length > 0) {
      return curatedMatches.slice(0, limit);
    }
    return filterCuratedCatalog('', mediaFilter).slice(0, limit);
  }
}

function extractKeywords(text: string): string[] {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .split(/[^a-z0-9]+/)
    .filter((word) => word.length > 2);
}

function matchesEra(item: MediaItem, eraPrompt: string): boolean {
  if (!eraPrompt || eraPrompt === 'Todas las épocas') return true;
  const year = item.year ?? 0;
  const dec = item.decade.toLowerCase();

  if (eraPrompt.includes('XVIII-XIX')) {
    return dec.includes('xviii') || dec.includes('xix') || (year > 0 && year < 1900);
  }
  if (eraPrompt.includes('1900s-1920s')) {
    return dec.includes('1900') || dec.includes('1910') || dec.includes('1920') || (year >= 1900 && year <= 1929);
  }
  if (eraPrompt.includes('1930s-1940s')) {
    return dec.includes('1930') || dec.includes('1940') || (year >= 1930 && year <= 1949);
  }
  if (eraPrompt.includes('1950s-1960s')) {
    return dec.includes('1950') || dec.includes('1960') || (year >= 1950 && year <= 1969);
  }
  if (eraPrompt.includes('2000s')) {
    return dec.includes('2000') || dec.includes('2010') || dec.includes('2020') || year >= 2000 || item.source === 'fma';
  }
  return true;
}

function scoreMediaItem(item: MediaItem, prompt: AIPlaylistPrompt): number {
  let score = 10;

  if (prompt.mediaFilter !== 'all' && item.mediaType !== prompt.mediaFilter) {
    return -100;
  }

  if (matchesEra(item, prompt.era)) {
    score += 30;
  }

  const haystack = [
    item.title,
    item.artist,
    item.albumOrCollection,
    item.decade,
    item.historicalContext,
    item.region ?? '',
    ...item.genres,
    ...item.moods,
  ]
    .join(' ')
    .toLowerCase();

  if (prompt.genre && prompt.genre !== 'Todos') {
    const genreWords = extractKeywords(prompt.genre);
    for (const gw of genreWords) {
      if (haystack.includes(gw)) score += 18;
    }
  }

  if (prompt.mood) {
    const moodWords = extractKeywords(prompt.mood);
    for (const mw of moodWords) {
      if (haystack.includes(mw)) score += 20;
    }
  }

  if (prompt.locationOrWeather) {
    const preset = LOCATION_WEATHER_PRESETS.find((p) => p.label === prompt.locationOrWeather);
    if (preset) {
      for (const sm of preset.suggestedMoods) {
        if (item.moods.some((m) => m.toLowerCase().includes(sm.toLowerCase()))) {
          score += 14;
        }
      }
    }
    for (const lw of extractKeywords(prompt.locationOrWeather)) {
      if (haystack.includes(lw)) score += 10;
    }
  }

  if (prompt.artistType) {
    for (const aw of extractKeywords(prompt.artistType)) {
      if (haystack.includes(aw)) score += 15;
    }
  }

  if (prompt.customPrompt) {
    for (const cw of extractKeywords(prompt.customPrompt)) {
      if (haystack.includes(cw)) score += 16;
    }
  }

  return score;
}

function buildPlaylistTitle(prompt: AIPlaylistPrompt): string {
  const moodPart = prompt.mood || 'Nostálgico';
  const loc = prompt.locationOrWeather || 'Archivo Abierto';

  if (loc.includes('Ciudad de México')) return `Crónicas de Lluvia y Vinilo (${moodPart})`;
  if (loc.includes('París')) return `Ecos Bohemios de Medianoche: ${moodPart}`;
  if (loc.includes('carretera') || loc.includes('Desierto')) return `Horizonte Nocturno en 78 RPM`;
  if (loc.includes('Kioto')) return `Luz de Estudio y Partituras Abiertas`;
  if (loc.includes('Nueva York')) return `Celuloide y Terciopelo: Sesión ${moodPart}`;

  const genreClean = prompt.genre && prompt.genre !== 'Todos' ? prompt.genre.split('&')[0].trim() : 'Dominio Público';
  return `Frecuencia Abierta: ${genreClean} & ${moodPart}`;
}

function buildReasoningForItem(item: MediaItem, prompt: AIPlaylistPrompt): string {
  const reasons: string[] = [];
  if (matchesEra(item, prompt.era) && prompt.era !== 'Todas las épocas') {
    reasons.push(`representa auténticamente la estética de ${item.decade}`);
  }
  if (prompt.mood && item.moods.some((m) => m.toLowerCase().includes(prompt.mood!.toLowerCase()))) {
    reasons.push(`su atmósfera ${prompt.mood.toLowerCase()} armoniza con "${prompt.locationOrWeather}"`);
  }
  if (reasons.length === 0) {
    reasons.push(
      `su textura de ${item.genres.slice(0, 2).join(' y ')} (${item.license.label}) aporta contraste histórico para "${prompt.locationOrWeather || 'tu sesión'}"`
    );
  }
  return `Seleccionada porque ${reasons.join(' y ')}. Fuente verificada: ${item.sourceLabel}.`;
}

/**
 * Genera una playlist inteligente combinando el catálogo curado y consultas en vivo a Internet Archive.
 */
async function generateSmartPlaylist(
  prompt: AIPlaylistPrompt,
  catalogPool: MediaItem[]
): Promise<Playlist> {
  let enrichedPool = [...catalogPool];

  const queryParts: string[] = [];
  if (prompt.genre && prompt.genre !== 'Todos') queryParts.push(prompt.genre.split('(')[0].trim());
  if (prompt.artistType) queryParts.push(prompt.artistType);
  if (prompt.customPrompt) queryParts.push(prompt.customPrompt);

  if (queryParts.length > 0) {
    try {
      const remoteItems = await searchArchiveMedia(queryParts.join(' '), prompt.mediaFilter);
      const existingIds = new Set(enrichedPool.map((i) => i.id));
      for (const remote of remoteItems.slice(0, 4)) {
        if (!existingIds.has(remote.id)) {
          enrichedPool.push(remote);
          existingIds.add(remote.id);
        }
      }
    } catch {
      // Modo resiliente: si archive.org no responde o no hay red, usamos el catálogo local
    }
  }

  const scored = enrichedPool
    .map((item) => ({ item, score: scoreMediaItem(item, prompt) }))
    .filter((entry) => entry.score > 0)
    .sort((a, b) => b.score - a.score);

  const selectedItems = (scored.length > 0 ? scored.slice(0, 8).map((s) => s.item) : catalogPool.slice(0, 6));

  const aiReasoning: Record<string, string> = {};
  for (const item of selectedItems) {
    aiReasoning[item.id] = buildReasoningForItem(item, prompt);
  }

  const title = buildPlaylistTitle(prompt).replace(/^recuencia/, 'Frecuencia');
  const description = [
    `Curaduría generada por IA para "${prompt.locationOrWeather || 'escucha inmersiva'}"`,
    prompt.era !== 'Todas las épocas' ? `enfocada en ${prompt.era}` : 'recorriendo múltiples décadas',
    prompt.genre !== 'Todos' ? `con énfasis en ${prompt.genre}` : 'en formato multimedia abierto',
    prompt.mood ? `bajo un pulso ${prompt.mood.toLowerCase()}.` : '.',
  ].join(', ');

  return {
    id: `ai-pl-${Date.now()}`,
    name: title,
    description,
    coverUrl: selectedItems[0]?.thumbnailUrl,
    createdAt: new Date().toISOString(),
    isAiGenerated: true,
    aiPrompt: prompt,
    aiReasoning,
    items: selectedItems,
  };
}

const DB_NAME = 'archive_player_offline_db';
const DB_VERSION = 1;
const STORE_BLOBS = 'media_blobs';
const STORE_RECORDS = 'media_records';

interface StoredBlobEntry {
  id: string;
  blob: Blob;
  mimeType: string;
  updatedAt: string;
}

const activeBlobUrls = new Map<string, string>();

/**
 * Abre o inicializa la base de datos IndexedDB para almacenamiento offline.
 */
function openOfflineDB(): Promise<IDBDatabase> {
  return new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !('indexedDB' in window)) {
      reject(new Error('IndexedDB no está disponible en este entorno.'));
      return;
    }

    const request = window.indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = (event) => {
      const db = (event.target as IDBOpenDBRequest).result;
      if (!db.objectStoreNames.contains(STORE_BLOBS)) {
        db.createObjectStore(STORE_BLOBS, { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains(STORE_RECORDS)) {
        db.createObjectStore(STORE_RECORDS, { keyPath: 'item.id' });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () =>
      reject(request.error ?? new Error('No se pudo abrir IndexedDB para modo offline.'));
  });
}

/**
 * Descarga el binario multimedia (MP3/MP4) y lo almacena en IndexedDB junto con sus metadatos.
 * Si un servidor externo bloquea la lectura CORS del binario, guarda un registro de respaldo
 * para que la experiencia de usuario responda sin fallar.
 */
async function saveMediaOffline(item: MediaItem): Promise<OfflineMediaRecord> {
  let mediaBlob: Blob | null = null;
  let sizeBytes = 0;

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 25000);

    const response = await fetch(item.downloadUrl || item.streamUrl, {
      mode: 'cors',
      signal: controller.signal,
    });
    clearTimeout(timeoutId);

    if (response.ok) {
      mediaBlob = await response.blob();
      sizeBytes = mediaBlob.size;
    }
  } catch {
    // Fallback resiliente cuando archive.org redirige a un nodo sin cabecera CORS para fetch binario
    mediaBlob = null;
  }

  if (!sizeBytes) {
    const duration = item.durationSeconds ?? 180;
    const bitrateBytesPerSec = item.mediaType === 'video' ? 96000 : 18000;
    sizeBytes = Math.round(duration * bitrateBytesPerSec);
  }

  const record: OfflineMediaRecord = {
    item,
    downloadedAt: new Date().toISOString(),
    sizeBytes,
  };

  try {
    const db = await openOfflineDB();
    await new Promise<void>((resolve, reject) => {
      const storeNames = mediaBlob ? [STORE_RECORDS, STORE_BLOBS] : [STORE_RECORDS];
      const tx = db.transaction(storeNames, 'readwrite');

      tx.objectStore(STORE_RECORDS).put(record);

      if (mediaBlob) {
        const blobEntry: StoredBlobEntry = {
          id: item.id,
          blob: mediaBlob,
          mimeType: mediaBlob.type || (item.mediaType === 'video' ? 'video/mp4' : 'audio/mpeg'),
          updatedAt: record.downloadedAt,
        };
        tx.objectStore(STORE_BLOBS).put(blobEntry);
      }

      tx.oncomplete = () => {
        db.close();
        resolve();
      };
      tx.onerror = () => {
        db.close();
        reject(tx.error ?? new Error('Error al escribir en IndexedDB.'));
      };
    });
  } catch {
    // Fallback adicional en memoria/localStorage si IndexedDB está restringido
  }

  return record;
}

/**
 * Obtiene un Object URL local (`blob:...`) desde IndexedDB si el archivo binario fue descargado.
 * Devuelve `null` si no existe el binario en local.
 */
async function getOfflineMediaBlobUrl(id: string): Promise<string | null> {
  const cachedUrl = activeBlobUrls.get(id);
  if (cachedUrl) {
    return cachedUrl;
  }

  try {
    const db = await openOfflineDB();
    const entry = await new Promise<StoredBlobEntry | undefined>((resolve, reject) => {
      const tx = db.transaction([STORE_BLOBS], 'readonly');
      const req = tx.objectStore(STORE_BLOBS).get(id);
      req.onsuccess = () => {
        db.close();
        resolve(req.result as StoredBlobEntry | undefined);
      };
      req.onerror = () => {
        db.close();
        reject(req.error);
      };
    });

    if (entry?.blob && entry.blob.size > 0) {
      const blobUrl = URL.createObjectURL(entry.blob);
      activeBlobUrls.set(id, blobUrl);
      return blobUrl;
    }
  } catch {
    return null;
  }

  return null;
}

/**
 * Elimina tanto el binario como el registro de metadatos del almacenamiento offline.
 */
async function removeOfflineMedia(id: string): Promise<void> {
  const existingUrl = activeBlobUrls.get(id);
  if (existingUrl) {
    URL.revokeObjectURL(existingUrl);
    activeBlobUrls.delete(id);
  }

  try {
    const db = await openOfflineDB();
    await new Promise<void>((resolve, reject) => {
      const tx = db.transaction([STORE_RECORDS, STORE_BLOBS], 'readwrite');
      tx.objectStore(STORE_RECORDS).delete(id);
      tx.objectStore(STORE_BLOBS).delete(id);
      tx.oncomplete = () => {
        db.close();
        resolve();
      };
      tx.onerror = () => {
        db.close();
        reject(tx.error);
      };
    });
  } catch {
    // Ignorar errores si la base de datos no está disponible
  }
}

/**
 * Lista todos los registros multimedia guardados para uso sin conexión,
 * ordenados del más reciente al más antiguo.
 */
async function listOfflineMediaRecords(): Promise<OfflineMediaRecord[]> {
  try {
    const db = await openOfflineDB();
    const records = await new Promise<OfflineMediaRecord[]>((resolve, reject) => {
      const tx = db.transaction([STORE_RECORDS], 'readonly');
      const req = tx.objectStore(STORE_RECORDS).getAll();
      req.onsuccess = () => {
        db.close();
        resolve((req.result as OfflineMediaRecord[]) ?? []);
      };
      req.onerror = () => {
        db.close();
        reject(req.error);
      };
    });

    return records.sort(
      (a, b) => new Date(b.downloadedAt).getTime() - new Date(a.downloadedAt).getTime()
    );
  } catch {
    return [];
  }
}

/**
 * Dispara la descarga directa del archivo original (.mp3 / .mp4) en el navegador del usuario.
 */
function triggerDirectBrowserDownload(item: MediaItem): void {
  if (typeof document === 'undefined') return;

  const extension = item.mediaType === 'video' ? 'mp4' : 'mp3';
  const safeFilename = `${item.artist} - ${item.title}`
    .replace(/[<>:"/\\|?*\x00-\x1F]/g, '')
    .trim()
    .slice(0, 100);

  const anchor = document.createElement('a');
  anchor.href = item.downloadUrl || item.streamUrl;
  anchor.download = `${safeFilename || item.id}.${extension}`;
  anchor.target = '_blank';
  anchor.rel = 'noopener noreferrer';
  document.body.appendChild(anchor);
  anchor.click();
  document.body.removeChild(anchor);
}

const PlayerContext = createContext<PlayerContextValue | undefined>(undefined);

const PlayerProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {
  const [catalog, setCatalog] = useState<MediaItem[]>(CURATED_CATALOG);
  const [currentItem, setCurrentItem] = useState<MediaItem | null>(CURATED_CATALOG[0] ?? null);
  const [queue, setQueue] = useState<MediaItem[]>(CURATED_CATALOG);
  const [isPlaying, setIsPlaying] = useState<boolean>(false);
  const [currentTime, setCurrentTime] = useState<number>(0);
  const [duration, setDuration] = useState<number>(CURATED_CATALOG[0]?.durationSeconds ?? 0);
  const [volume, setVolumeState] = useState<number>(0.85);
  const [isMuted, setIsMuted] = useState<boolean>(false);
  const [isShuffle, setIsShuffle] = useState<boolean>(false);
  const [repeatMode, setRepeatMode] = useState<'off' | 'all' | 'one'>('off');

  const [showLinerNotes, setShowLinerNotes] = useState<boolean>(false);
  const [showVideoOverlay, setShowVideoOverlay] = useState<boolean>(false);
  const [silentFilmVisualizer, setSilentFilmVisualizer] = useState<boolean>(false);
  const [audioOnlyMode, setAudioOnlyMode] = useState<boolean>(false);

  const [favoriteIds, setFavoriteIds] = useState<string[]>(() => {
    try {
      const raw = localStorage.getItem(FAVORITES_STORAGE_KEY);
      return raw ? (JSON.parse(raw) as string[]) : ['musopen-chopin-nocturne-op9-no2', 'oma-django-minor-swing'];
    } catch {
      return [];
    }
  });

  const [playlists, setPlaylists] = useState<Playlist[]>(() => {
    try {
      const raw = localStorage.getItem(PLAYLISTS_STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw) as Playlist[];
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch {
      // Fallback a playlists predeterminadas
    }
    return buildDefaultPlaylists(CURATED_CATALOG);
  });

  const [offlineRecords, setOfflineRecords] = useState<OfflineMediaRecord[]>([]);
  const [downloadingIds, setDownloadingIds] = useState<string[]>([]);
  const [isOnline, setIsOnline] = useState<boolean>(() =>
    typeof navigator !== 'undefined' ? navigator.onLine : true
  );

  const audioRef = useRef<HTMLAudioElement | null>(null);
  const shouldUseInternalAudio = !currentItem || currentItem.mediaType === 'audio' || audioOnlyMode || !showVideoOverlay;
  const shouldUseInternalAudioRef = useRef<boolean>(shouldUseInternalAudio);
  const currentTimeRef = useRef<number>(currentTime);

  useEffect(() => {
    shouldUseInternalAudioRef.current = shouldUseInternalAudio;
  }, [shouldUseInternalAudio]);

  useEffect(() => {
    currentTimeRef.current = currentTime;
  }, [currentTime]);

  useEffect(() => {
    try {
      localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(favoriteIds));
    } catch { /* ignorar quota */ }
  }, [favoriteIds]);

  useEffect(() => {
    try {
      localStorage.setItem(PLAYLISTS_STORAGE_KEY, JSON.stringify(playlists));
    } catch { /* ignorar quota */ }
  }, [playlists]);

  useEffect(() => {
    listOfflineMediaRecords().then(setOfflineRecords).catch(() => {});
    const onOnline = () => setIsOnline(true);
    const onOffline = () => setIsOnline(false);
    window.addEventListener('online', onOnline);
    window.addEventListener('offline', onOffline);
    return () => {
      window.removeEventListener('online', onOnline);
      window.removeEventListener('offline', onOffline);
    };
  }, []);

  const getEffectiveStreamUrl = useCallback(async (item: MediaItem): Promise<string> => {
    const blobUrl = await getOfflineMediaBlobUrl(item.id);
    return blobUrl || item.streamUrl;
  }, []);

  const nextTrack = useCallback(() => {
    if (!currentItem || queue.length === 0) return;
    if (repeatMode === 'one') {
      setCurrentTime(0);
      if (audioRef.current && shouldUseInternalAudioRef.current) {
        audioRef.current.currentTime = 0;
        audioRef.current.play().catch(() => {});
      }
      setIsPlaying(true);
      return;
    }
    if (isShuffle && queue.length > 1) {
      const candidates = queue.filter((i) => i.id !== currentItem.id);
      const randomItem = candidates[Math.floor(Math.random() * candidates.length)] ?? queue[0];
      setCurrentItem(randomItem);
      setCurrentTime(0);
      setIsPlaying(true);
      return;
    }
    const idx = queue.findIndex((i) => i.id === currentItem.id);
    const nextIdx = idx + 1;
    if (nextIdx < queue.length) {
      setCurrentItem(queue[nextIdx]);
      setCurrentTime(0);
      setIsPlaying(true);
    } else if (repeatMode === 'all') {
      setCurrentItem(queue[0]);
      setCurrentTime(0);
      setIsPlaying(true);
    } else {
      setIsPlaying(false);
    }
  }, [currentItem, queue, repeatMode, isShuffle]);

  const prevTrack = useCallback(() => {
    if (!currentItem || queue.length === 0) return;
    if (currentTime > 4) {
      setCurrentTime(0);
      if (audioRef.current && shouldUseInternalAudioRef.current) {
        audioRef.current.currentTime = 0;
      }
      return;
    }
    const idx = queue.findIndex((i) => i.id === currentItem.id);
    const prevIdx = idx > 0 ? idx - 1 : queue.length - 1;
    setCurrentItem(queue[prevIdx]);
    setCurrentTime(0);
    setIsPlaying(true);
  }, [currentItem, queue, currentTime]);

  useEffect(() => {
    if (!audioRef.current) {
      audioRef.current = new Audio();
      audioRef.current.preload = 'metadata';
    }
    const audio = audioRef.current;
    const handleTimeUpdate = () => {
      if (shouldUseInternalAudioRef.current) {
        setCurrentTime(audio.currentTime);
      }
    };
    const handleLoadedMetadata = () => {
      if (audio.duration && Number.isFinite(audio.duration)) setDuration(audio.duration);
    };
    const handleEnded = () => {
      if (shouldUseInternalAudioRef.current) {
        nextTrack();
      }
    };

    audio.addEventListener('timeupdate', handleTimeUpdate);
    audio.addEventListener('loadedmetadata', handleLoadedMetadata);
    audio.addEventListener('ended', handleEnded);
    return () => {
      audio.removeEventListener('timeupdate', handleTimeUpdate);
      audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
      audio.removeEventListener('ended', handleEnded);
    };
  }, [nextTrack]);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || !currentItem) return;
    let cancelled = false;
    setDuration(currentItem.durationSeconds ?? 0);

    getEffectiveStreamUrl(currentItem).then((resolvedUrl) => {
      if (cancelled) return;
      if (audio.src !== resolvedUrl) {
        audio.src = resolvedUrl;
        audio.load();
      }
      if (shouldUseInternalAudio) {
        if (Math.abs(audio.currentTime - currentTimeRef.current) > 1.5) {
          audio.currentTime = currentTimeRef.current;
        }
        if (isPlaying) {
          audio.play().catch(() => setIsPlaying(false));
        } else {
          audio.pause();
        }
      } else {
        audio.pause();
      }
    });
    return () => {
      cancelled = true;
    };
  }, [currentItem, getEffectiveStreamUrl, shouldUseInternalAudio]);

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio) return;
    if (isPlaying && shouldUseInternalAudio) {
      if (Math.abs(audio.currentTime - currentTimeRef.current) > 1.5) {
        audio.currentTime = currentTimeRef.current;
      }
      audio.play().catch(() => setIsPlaying(false));
    } else {
      audio.pause();
    }
  }, [isPlaying, shouldUseInternalAudio]);

  useEffect(() => {
    if (!audioRef.current) return;
    audioRef.current.volume = Math.max(0, Math.min(1, volume));
    audioRef.current.muted = isMuted;
  }, [volume, isMuted]);

  useEffect(() => {
    if (typeof navigator === 'undefined' || !('mediaSession' in navigator) || !currentItem) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: currentItem.title,
        artist: currentItem.artist,
        album: currentItem.albumOrCollection,
        artwork: [{ src: currentItem.thumbnailUrl, sizes: '512x512', type: 'image/jpeg' }],
      });
      navigator.mediaSession.setActionHandler('play', () => setIsPlaying(true));
      navigator.mediaSession.setActionHandler('pause', () => setIsPlaying(false));
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    } catch { /* ignorar navegadores sin soporte completo */ }
  }, [currentItem, prevTrack, nextTrack]);

  const playItem = useCallback((item: MediaItem, newQueue?: MediaItem[]) => {
    setCatalog((prev) => (prev.some((i) => i.id === item.id) ? prev : [...prev, item]));
    if (newQueue && newQueue.length > 0) setQueue(newQueue);
    setCurrentItem(item);
    setCurrentTime(0);
    setIsPlaying(true);
    if (item.mediaType === 'video' && !audioOnlyMode) {
      setShowVideoOverlay(true);
    }
  }, [audioOnlyMode]);

  const togglePlay = useCallback(() => setIsPlaying((prev) => !prev), []);

  const seekTo = useCallback((seconds: number) => {
    const clamped = Math.max(0, seconds);
    setCurrentTime(clamped);
    if (audioRef.current && shouldUseInternalAudioRef.current) {
      audioRef.current.currentTime = clamped;
    }
  }, []);

  const setVolume = useCallback((vol: number) => {
    setVolumeState(Math.max(0, Math.min(1, vol)));
    if (vol > 0) setIsMuted(false);
  }, []);

  const toggleMute = useCallback(() => setIsMuted((m) => !m), []);
  const toggleShuffle = useCallback(() => setIsShuffle((s) => !s), []);
  const cycleRepeatMode = useCallback(() => {
    setRepeatMode((m) => (m === 'off' ? 'all' : m === 'all' ? 'one' : 'off'));
  }, []);

  const toggleFavorite = useCallback((item: MediaItem) => {
    setCatalog((prev) => (prev.some((i) => i.id === item.id) ? prev : [...prev, item]));
    setFavoriteIds((prev) =>
      prev.includes(item.id) ? prev.filter((id) => id !== item.id) : [...prev, item.id]
    );
  }, []);

  const isFavorite = useCallback((id: string) => favoriteIds.includes(id), [favoriteIds]);

  const createPlaylist = useCallback(
    (
      name: string,
      description: string,
      initialItems: MediaItem[] = [],
      aiMeta?: { isAiGenerated?: boolean; aiPrompt?: AIPlaylistPrompt; aiReasoning?: Record<string, string> }
    ): Playlist => {
      const newPl: Playlist = {
        id: `pl-${Date.now()}`,
        name,
        description,
        coverUrl: initialItems[0]?.thumbnailUrl,
        createdAt: new Date().toISOString(),
        isAiGenerated: Boolean(aiMeta?.isAiGenerated),
        aiPrompt: aiMeta?.aiPrompt,
        aiReasoning: aiMeta?.aiReasoning,
        items: initialItems,
      };
      setPlaylists((prev) => [newPl, ...prev]);
      return newPl;
    },
    []
  );

  const deletePlaylist = useCallback((playlistId: string) => {
    setPlaylists((prev) => prev.filter((p) => p.id !== playlistId));
  }, []);

  const addItemToPlaylist = useCallback((playlistId: string, item: MediaItem) => {
    setPlaylists((prev) =>
      prev.map((p) =>
        p.id === playlistId && !p.items.some((i) => i.id === item.id)
          ? { ...p, items: [...p.items, item], coverUrl: p.coverUrl || item.thumbnailUrl }
          : p
      )
    );
  }, []);

  const removeItemFromPlaylist = useCallback((playlistId: string, itemId: string) => {
    setPlaylists((prev) =>
      prev.map((p) => (p.id === playlistId ? { ...p, items: p.items.filter((i) => i.id !== itemId) } : p))
    );
  }, []);

  const playPlaylist = useCallback((playlist: Playlist) => {
    if (playlist.items.length === 0) return;
    setQueue(playlist.items);
    setCurrentItem(playlist.items[0]);
    setCurrentTime(0);
    setIsPlaying(true);
    if (playlist.items[0].mediaType === 'video' && !audioOnlyMode) {
      setShowVideoOverlay(true);
    }
  }, [audioOnlyMode]);

  const isOfflineDownloaded = useCallback(
    (id: string) => offlineRecords.some((r) => r.item.id === id),
    [offlineRecords]
  );

  const downloadForOffline = useCallback(async (item: MediaItem) => {
    setDownloadingIds((prev) => (prev.includes(item.id) ? prev : [...prev, item.id]));
    try {
      const record = await saveMediaOffline(item);
      setOfflineRecords((prev) => [record, ...prev.filter((r) => r.item.id !== item.id)]);
    } finally {
      setDownloadingIds((prev) => prev.filter((id) => id !== item.id));
    }
  }, []);

  const removeOfflineDownload = useCallback(async (id: string) => {
    await removeOfflineMedia(id);
    setOfflineRecords((prev) => prev.filter((r) => r.item.id !== id));
  }, []);

  const value = useMemo<PlayerContextValue>(
    () => ({
      catalog,
      currentItem,
      queue,
      isPlaying,
      currentTime,
      duration,
      volume,
      isMuted,
      isShuffle,
      repeatMode,
      showLinerNotes,
      showVideoOverlay,
      silentFilmVisualizer,
      audioOnlyMode,
      playItem,
      togglePlay,
      nextTrack,
      prevTrack,
      seekTo,
      setVolume,
      toggleMute,
      toggleShuffle,
      cycleRepeatMode,
      setShowLinerNotes,
      setShowVideoOverlay,
      setSilentFilmVisualizer,
      setAudioOnlyMode,
      favoriteIds,
      toggleFavorite,
      isFavorite,
      playlists,
      createPlaylist,
      deletePlaylist,
      addItemToPlaylist,
      removeItemFromPlaylist,
      playPlaylist,
      offlineRecords,
      downloadingIds,
      isOfflineDownloaded,
      downloadForOffline,
      removeOfflineDownload,
      getEffectiveStreamUrl,
      isOnline,
    }),
    [
      catalog, currentItem, queue, isPlaying, currentTime, duration, volume, isMuted,
      isShuffle, repeatMode, showLinerNotes, showVideoOverlay, silentFilmVisualizer,
      audioOnlyMode, playItem, togglePlay, nextTrack, prevTrack, seekTo, setVolume,
      toggleMute, toggleShuffle, cycleRepeatMode, favoriteIds, toggleFavorite,
      isFavorite, playlists, createPlaylist, deletePlaylist, addItemToPlaylist,
      removeItemFromPlaylist, playPlaylist, offlineRecords, downloadingIds,
      isOfflineDownloaded, downloadForOffline, removeOfflineDownload,
      getEffectiveStreamUrl, isOnline,
    ]
  );

  return <PlayerContext.Provider value={value}>{children}</PlayerContext.Provider>;
};

function usePlayer(): PlayerContextValue {
  const ctx = useContext(PlayerContext);
  if (!ctx) {
    throw new Error('usePlayer debe utilizarse dentro de un PlayerProvider');
  }
  return ctx;
}

interface HeaderProps {
  activeView: AppView;

  onSearchQueryChange: (query: string) => void;
  onLiveSearchResults: (items: MediaItem[], query: string) => void;
  isSearchingArchive: boolean;
  setIsSearchingArchive: (loading: boolean) => void;
}

const Header: React.FC<HeaderProps> = ({
  activeView,
  onSelectView,
  searchQuery,
  onSearchQueryChange,
  onLiveSearchResults,
  isSearchingArchive,
  setIsSearchingArchive,
}) => {
  const { isOnline, currentItem, showLinerNotes, setShowLinerNotes } = usePlayer();
  const [searchError, setSearchError] = useState<string | null>(null);

  const handleTriggerArchiveSearch = async (e?: React.FormEvent) => {
    if (e) e.preventDefault();
    const trimmed = searchQuery.trim();
    if (!trimmed) return;

    setSearchError(null);
    setIsSearchingArchive(true);
    if (activeView !== 'explore') {
      onSelectView('explore');
    }

    try {
      const results = await searchArchiveMedia(trimmed, 'all');
      onLiveSearchResults(results, trimmed);
    } catch {
      setSearchError('Modo local activo: archive.org no disponible temporalmente.');
      onLiveSearchResults([], trimmed);
    } finally {
      setIsSearchingArchive(false);
    }
  };

  const handleClearSearch = () => {
    onSearchQueryChange('');
    onLiveSearchResults([], '');
    setSearchError(null);
  };

  return (
    <header className="sticky top-0 z-30 bg-zinc-950/85 backdrop-blur-md border-b border-zinc-800/80 px-4 lg:px-8 py-3">
      <div className="flex flex-wrap items-center justify-between gap-3">
        {/* Buscador en tiempo real + conexión a archive.org */}
        <form
          onSubmit={handleTriggerArchiveSearch}
          className="flex-1 min-w-[240px] max-w-2xl flex items-center gap-2"
        >
          <div className="relative flex-1">
            <Search className="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
            <input
              type="text"
              value={searchQuery}
              onChange={(e) => {
                onSearchQueryChange(e.target.value);
                if (activeView !== 'explore' && e.target.value.trim().length > 0) {
                  onSelectView('explore');
                }
              }}
              placeholder="Buscar por obra, compositor, década o consultar en archive.org..."
              className="w-full pl-10 pr-9 py-2 rounded-xl bg-zinc-900/90 border border-zinc-800 text-sm text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:border-amber-500/60 focus:ring-1 focus:ring-amber-500/30 transition-all"
            />
            {searchQuery && (
              <button
                type="button"
                onClick={handleClearSearch}
                className="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-zinc-400 hover:text-zinc-200"
                title="Limpiar búsqueda"
              >
                <X className="w-3.5 h-3.5" />
              </button>
            )}
          </div>

          <button
            type="submit"

            title="Consultar API en vivo de Internet Archive (archive.org)"
          >
            {isSearchingArchive ? (
              <Loader2 className="w-3.5 h-3.5 animate-spin text-amber-400" />
            ) : (
              <Globe className="w-3.5 h-3.5 text-amber-400" />
            )}
            <span className="hidden sm:inline">Buscar en archive.org</span>
          </button>
        </form>

        {/* Indicadores de estado y accesos rápidos */}
        <div className="flex items-center gap-2.5">
          {/* Estado de red Online / Offline */}
          <div
            onClick={() => !isOnline && onSelectView('offline')}
            className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-medium border transition-colors ${
              isOnline

                showLinerNotes
                  ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'

function formatSeconds(sec: number): string {
  if (!Number.isFinite(sec) || sec < 0) return '0:00';
  const total = Math.floor(sec);
  const mins = Math.floor(total / 60);
  const rem = total % 60;
  return `${mins}:${rem < 10 ? '0' : ''}${rem}`;
}

                onClick={() => {
                  if (audioOnlyMode) {
                    setAudioOnlyMode(false);
                    setShowVideoOverlay(true);
                  } else {
                    setShowVideoOverlay(!showVideoOverlay);

                }}
                className={`p-2 rounded-xl border text-xs flex items-center gap-1.5 transition-colors cursor-pointer ${
                  showVideoOverlay && !audioOnlyMode
                    ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'

                title="Mostrar u ocultar proyector de video"
              >
                <Film className="w-3.5 h-3.5" />
                <span className="hidden xl:inline">Visor Video</span>
              </button>
            )}

            <button
              type="button"
              onClick={() => downloadForOffline(currentItem)}
              disabled={downloading}
              className={`p-2 rounded-xl border transition-colors cursor-pointer ${
                downloaded

                  : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:text-zinc-200'
              }`}
              title={downloaded ? 'Guardado en modo Offline' : 'Guardar para escuchar sin conexión'}
            >
              {downloading ? (
                <Loader2 className="w-3.5 h-3.5 animate-spin text-amber-400" />
              ) : downloaded ? (
                <Check className="w-3.5 h-3.5" />
              ) : (
                <DownloadCloud className="w-3.5 h-3.5" />
              )}
            </button>

            <button
              type="button"
              onClick={() => setShowLinerNotes(!showLinerNotes)}
              className={`p-2 rounded-xl border transition-colors cursor-pointer ${
                showLinerNotes
                  ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                  : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:text-zinc-200'
              }`}
              title="Contexto Histórico y Atribución"
            >
              <BookOpen className="w-3.5 h-3.5" />
            </button>

            <div className="flex items-center gap-1.5 pl-1">
              <button
                type="button"
                onClick={toggleMute}
                className="text-zinc-400 hover:text-zinc-200 cursor-pointer"
                title={isMuted ? 'Activar sonido' : 'Silenciar'}
              >
                {isMuted || volume === 0 ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
              </button>
              <input
                type="range"
                min={0}
                max={1}
                step={0.02}
                value={isMuted ? 0 : volume}
                onChange={(e) => setVolume(Number(e.target.value))}
                className="w-16 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-amber-500"
                aria-label="Volumen"
              />
            </div>
          </div>
        </div>
      </footer>
    </>
  );
};

interface ExploreViewProps {
  searchQuery: string;
  liveSearchResults: MediaItem[];
  lastLiveQuery: string;
  isSearchingArchive: boolean;
  onSelectView: (view: AppView) => void;
}

const ExploreView: React.FC<ExploreViewProps> = ({
  searchQuery,
  liveSearchResults,
  lastLiveQuery,
  isSearchingArchive,
  onSelectView,
}) => {
  const {
    catalog,
    currentItem,
    isPlaying,
    playItem,
    togglePlay,
    toggleFavorite,
    isFavorite,
    playlists,
    addItemToPlaylist,
    isOfflineDownloaded,
    downloadingIds,
    downloadForOffline,
    setShowLinerNotes,
  } = usePlayer();

  const [mediaFilter, setMediaFilter] = useState<'all' | 'audio' | 'video'>('all');
  const [sourceFilter, setSourceFilter] = useState<string>('all');
  const [playlistMenuItemId, setPlaylistMenuItemId] = useState<string | null>(null);
  const [addedFeedbackId, setAddedFeedbackId] = useState<string | null>(null);

  const combinedItems = useMemo(() => {
    const query = searchQuery.trim().toLowerCase();
    const basePool =
      liveSearchResults.length > 0 && lastLiveQuery
        ? [
            ...liveSearchResults,
            ...catalog.filter(
              (c) => !liveSearchResults.some((r) => r.archiveIdentifier === c.archiveIdentifier)
            ),
          ]
        : catalog;

    return basePool.filter((item) => {
      if (mediaFilter !== 'all' && item.mediaType !== mediaFilter) return false;
      if (sourceFilter !== 'all' && item.source !== sourceFilter) return false;
      if (!query) return true;

      const haystack = [
        item.title,
        item.artist,
        item.albumOrCollection,
        item.decade,
        item.sourceLabel,
        item.region || '',
        ...item.genres,
        ...item.moods,
      ]
        .join(' ')
        .toLowerCase();

      return haystack.includes(query);
    });
  }, [catalog, liveSearchResults, lastLiveQuery, searchQuery, mediaFilter, sourceFilter]);

  const featuredHeroItem = useMemo(
    () =>
      catalog.find((i) => i.id === 'video-melies-voyage-dans-la-lune') ||
      catalog[0],
    [catalog]
  );

  const handleAddToPlaylist = (playlistId: string, item: MediaItem) => {
    addItemToPlaylist(playlistId, item);
    setPlaylistMenuItemId(null);
    setAddedFeedbackId(item.id);
    setTimeout(() => setAddedFeedbackId(null), 1800);
  };

  return (
    <div className="space-y-8 pb-12">
      {/* Hero Banner Cultural */}
      {!searchQuery.trim() && featuredHeroItem && (
        <section className="relative rounded-3xl overflow-hidden border border-amber-500/25 bg-gradient-to-br from-zinc-900 via-zinc-950 to-amber-950/35 p-6 sm:p-8 shadow-2xl">
          <div className="relative z-10 max-w-2xl space-y-4">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/15 border border-amber-400/30 text-amber-300 text-xs font-semibold">
              <Sparkles className="w-3.5 h-3.5" />
              <span>Archivo Abierto • Patrimonio Sonoro y Audiovisual Libre</span>
            </div>

            <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight text-zinc-100 leading-tight">
              Sala de Escucha y Cine Clásico sin Barreras de Copyright
            </h2>

            <p className="text-sm sm:text-base text-zinc-300/90 leading-relaxed">
              Explora grabaciones históricas en 78rpm, nocturnos de Musopen, cortos restaurados de
              Georges Méliès y Buster Keaton o deja que el Curador IA arme una sesión según tu
              clima, época y estado de ánimo.
            </p>

            <div className="flex flex-wrap items-center gap-3 pt-1">
              <button
                type="button"
                onClick={() => playItem(featuredHeroItem, catalog)}
                className="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition-all cursor-pointer"
              >
                <Play className="w-4 h-4 fill-zinc-950" />
                <span>Ver "{featuredHeroItem.title}" (1902)</span>
              </button>

              <button
                type="button"
                onClick={() => onSelectView('ai-curator')}
                className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900/90 hover:bg-zinc-800 text-amber-300 border border-amber-500/35 font-semibold text-sm transition-colors cursor-pointer"
              >
                <Sparkles className="w-4 h-4" />
                <span>Generar Playlist con IA</span>
              </button>
            </div>
          </div>
        </section>
      )}

      {/* Barra de Filtros Rápidos */}
      <section className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-2 overflow-x-auto pb-1">
          {[
            { id: 'all', label: 'Todo el Catálogo', icon: Globe },
            { id: 'audio', label: 'Música y Archivo Sonoro', icon: Music },
            { id: 'video', label: 'Cine Clásico y Video', icon: Film },
          ].map((tab) => {
            const Icon = tab.icon;
            const active = mediaFilter === tab.id;

              <button
                key={tab.id}

                className={`inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold border transition-all cursor-pointer ${
                  active

};

interface ArtistsAlbumsViewProps {
  mode: 'artists' | 'albums' | 'videos';
}

interface GroupedBucket {
  key: string;
  title: string;
  subtitle: string;
  coverUrl: string;
  decade: string;
  archiveIdentifier: string;
  items: MediaItem[];
}

const ArtistsAlbumsView: React.FC<ArtistsAlbumsViewProps> = ({ mode }) => {
  const {
    catalog,
    playItem,
    toggleFavorite,
    isFavorite,
    isOfflineDownloaded,
    downloadingIds,
    downloadForOffline,
    setShowLinerNotes,
  } = usePlayer();

  const [selectedGroupKey, setSelectedGroupKey] = useState<string | null>(null);
  const [expandedArchiveTracks, setExpandedArchiveTracks] = useState<Record<string, MediaItem[]>>(
    {}
  );
  const [loadingArchiveId, setLoadingArchiveId] = useState<string | null>(null);

  const groups = useMemo<GroupedBucket[]>(() => {
    if (mode === 'videos') return [];
    const map = new Map<string, GroupedBucket>();

    for (const item of catalog) {
      const groupTitle = mode === 'artists' ? item.artist : item.albumOrCollection;
      const existing = map.get(groupTitle);
      if (existing) {
        existing.items.push(item);
      } else {
        map.set(groupTitle, {
          key: groupTitle,
          title: groupTitle,
          subtitle:
            mode === 'artists'
              ? `${item.genres.slice(0, 2).join(' • ')} (${item.region || item.decade})`
              : `${item.artist} • ${item.sourceLabel}`,
          coverUrl: item.thumbnailUrl,
          decade: item.decade,
          archiveIdentifier: item.archiveIdentifier,
          items: [item],
        });
      }
    }

    return Array.from(map.values());
  }, [catalog, mode]);

  const videoCatalog = useMemo(
    () => catalog.filter((item) => item.mediaType === 'video'),
    [catalog]
  );

  const handleLoadAlbumTracks = async (identifier: string) => {
    if (!identifier || loadingArchiveId === identifier) return;
    setLoadingArchiveId(identifier);
    try {
      const tracks = await fetchArchiveItemTracks(identifier);
      if (tracks.length > 0) {
        setExpandedArchiveTracks((prev) => ({ ...prev, [identifier]: tracks }));
      }
    } finally {
      setLoadingArchiveId(null);
    }
  };

  if (mode === 'videos') {
    return (
      <div className="space-y-6 pb-12">
        <div className="flex flex-wrap items-center justify-between gap-3 border-b border-zinc-800/80 pb-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400">
              <Film className="w-5 h-5" />
            </div>
            <div>
              <h2 className="text-xl font-bold text-zinc-100">
                Filmoteca Abierta y Cine de Dominio Público
              </h2>
              <p className="text-xs text-zinc-400">
                Películas completas, cortos silentes restaurados, animación Fleischer y archivos Prelinger
              </p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
          {videoCatalog.map((video) => {
            const fav = isFavorite(video.id);
            const downloaded = isOfflineDownloaded(video.id);
            const downloading = downloadingIds.includes(video.id);

            return (
              <article
                key={video.id}
                className="rounded-2xl bg-zinc-900/80 border border-zinc-800/90 overflow-hidden flex flex-col justify-between group hover:border-amber-500/40 transition-all"
              >
                <div>
                  <div className="relative aspect-video bg-black overflow-hidden">
                    <img
                      src={video.thumbnailUrl}
                      alt={video.title}
                      className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-transparent" />
                    <button
                      type="button"
                      onClick={() => playItem(video, videoCatalog)}
                      className="absolute inset-0 m-auto w-14 h-14 rounded-full bg-amber-500/95 hover:bg-amber-400 text-zinc-950 flex items-center justify-center shadow-2xl transition-transform group-hover:scale-110 cursor-pointer"
                      title="Proyectar película"
                    >
                      <Play className="w-6 h-6 fill-zinc-950 ml-0.5" />
                    </button>
                    <span className="absolute top-3 left-3 px-2.5 py-1 rounded-md bg-zinc-950/85 text-[10px] font-semibold text-amber-300 border border-amber-500/30">
                      {video.year} • {video.sourceLabel}
                    </span>
                    <span className="absolute bottom-3 right-3 px-2 py-0.5 rounded bg-emerald-950/90 text-[10px] font-semibold text-emerald-300 border border-emerald-500/30 flex items-center gap-1">
                      <ShieldCheck className="w-3 h-3" />
                      {video.license.label}
                    </span>
                  </div>

                  <div className="p-5 space-y-2">
                    <h3 className="text-base font-bold text-zinc-100">{video.title}</h3>
                    <p className="text-xs text-amber-300/90 font-medium">{video.artist}</p>
                    <p className="text-xs text-zinc-400 leading-relaxed line-clamp-3">
                      {video.historicalContext}
                    </p>
                  </div>
                </div>

                <div className="px-5 py-3 border-t border-zinc-800/80 flex items-center justify-between bg-zinc-950/40">
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => toggleFavorite(video)}
                      className={`p-1.5 rounded-lg cursor-pointer ${
                        fav ? 'text-amber-400 bg-amber-500/10' : 'text-zinc-400 hover:text-zinc-200'
                      }`}
                    >
                      <Heart className={`w-4 h-4 ${fav ? 'fill-amber-400' : ''}`} />
                    </button>
                    <button
                      type="button"
                      onClick={() => downloadForOffline(video)}
                      disabled={downloading}
                      className="p-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 cursor-pointer"
                      title="Descargar película para modo Offline"
                    >
                      {downloading ? (
                        <Loader2 className="w-4 h-4 animate-spin text-amber-400" />
                      ) : downloaded ? (
                        <Check className="w-4 h-4 text-emerald-400" />
                      ) : (
                        <DownloadCloud className="w-4 h-4" />
                      )}
                    </button>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      playItem(video, videoCatalog);
                      setShowLinerNotes(true);
                    }}
                    className="inline-flex items-center gap-1.5 text-xs font-semibold text-amber-300 hover:text-amber-200 cursor-pointer"
                  >
                    <BookOpen className="w-3.5 h-3.5" />
                    <span>Ficha y Créditos</span>
                  </button>
                </div>
              </article>
            );
          })}
        </div>
      </div>
    );
  }

  const activeGroup = groups.find((g) => g.key === selectedGroupKey) || groups[0];
  const extraTracks = activeGroup
    ? expandedArchiveTracks[activeGroup.archiveIdentifier] || []
    : [];
  const displayedTracks = activeGroup
    ? [
        ...activeGroup.items,
        ...extraTracks.filter((t) => !activeGroup.items.some((i) => i.id === t.id)),
      ]
    : [];

  return (
    <div className="space-y-6 pb-12">
      {/* Cabecera de sección */}
      <div className="flex items-center gap-3 border-b border-zinc-800/80 pb-4">
        <div className="w-10 h-10 rounded-2xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center text-amber-400">
          {mode === 'artists' ? <Users className="w-5 h-5" /> : <Disc3 className="w-5 h-5" />}
        </div>
        <div>
          <h2 className="text-xl font-bold text-zinc-100">
            {mode === 'artists'
              ? 'Compositores, Intérpretes y Directores'
              : 'Álbumes, Obras y Colecciones de Archivo'}
          </h2>
          <p className="text-xs text-zinc-400">
            {mode === 'artists'
              ? 'Explora el catálogo agrupado por creador histórico y época'
              : 'Inspecciona colecciones curadas y extrae todas las pistas multipista desde archive.org'}
          </p>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
        {/* Lista lateral de Artistas o Álbumes */}
        <div className="lg:col-span-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2.5 max-h-[640px] overflow-y-auto pr-1">
          {groups.map((group) => {
            const isSelected = activeGroup?.key === group.key;
            return (
              <button
                key={group.key}
                type="button"
                onClick={() => setSelectedGroupKey(group.key)}
                className={`flex items-center gap-3.5 p-3 rounded-2xl border text-left transition-all cursor-pointer ${
                  isSelected
                    ? 'bg-amber-500/15 border-amber-500/45 shadow-md'
                    : 'bg-zinc-900/60 border-zinc-800/80 hover:bg-zinc-900 hover:border-zinc-700'
                }`}
              >
                <img
                  src={group.coverUrl}
                  alt={group.title}
                  className="w-14 h-14 rounded-xl object-cover bg-zinc-800 shrink-0"
                />
                <div className="min-w-0 flex-1">
                  <span className="text-[10px] font-mono text-amber-400">{group.decade}</span>
                  <h3 className="text-sm font-bold text-zinc-100 truncate">{group.title}</h3>
                  <p className="text-xs text-zinc-400 truncate">{group.subtitle}</p>
                </div>
                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-zinc-800 text-zinc-300">
                  {group.items.length}
                </span>
              </button>
            );
          })}
        </div>

        {/* Panel de detalle del Artista o Álbum seleccionado */}
        {activeGroup && (
          <div className="lg:col-span-7 rounded-3xl bg-zinc-900/75 border border-zinc-800/90 p-6 space-y-6">
            <div className="flex flex-col sm:flex-row gap-5 items-start sm:items-center justify-between border-b border-zinc-800 pb-5">
              <div className="flex items-center gap-4">
                <img
                  src={activeGroup.coverUrl}
                  alt={activeGroup.title}
                  className="w-20 h-20 rounded-2xl object-cover border border-zinc-700 shadow-lg"
                />
                <div>
                  <span className="text-[11px] font-semibold uppercase tracking-wider text-amber-400">
                    {mode === 'artists' ? 'Perfil de Creador' : 'Colección / Álbum'}
                  </span>
                  <h3 className="text-lg sm:text-xl font-bold text-zinc-100 mt-0.5">
                    {activeGroup.title}
                  </h3>
                  <p className="text-xs text-zinc-400 mt-1">{activeGroup.subtitle}</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  type="button"
                  onClick={() => playItem(displayedTracks[0], displayedTracks)}
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold text-xs cursor-pointer"
                >
                  <Play className="w-3.5 h-3.5 fill-zinc-950" />
                  <span>Reproducir Todo</span>
                </button>

                <button
                  type="button"
                  onClick={() => handleLoadAlbumTracks(activeGroup.archiveIdentifier)}

                    >
                      <Play className="w-3.5 h-3.5 fill-current" />

                        {track.artist} • {track.decade} • {track.license.label}
                      </p>

                  <button
                    type="button"
                    onClick={() => {
                      playItem(track, displayedTracks);
                      setShowLinerNotes(true);
                    }}
                    className="px-2.5 py-1 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-[11px] text-amber-300 border border-zinc-800 shrink-0 cursor-pointer"
                  >
                    Liner Notes
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

}

                      className="p-1.5 rounded-lg bg-amber-500/15 text-amber-300 hover:bg-amber-500 hover:text-zinc-950 cursor-pointer"
                    >
                      <Play className="w-3.5 h-3.5 fill-current" />
                    </button>
                    <button
                      type="button"
                      onClick={() => removeItemFromPlaylist(activePlaylist.id, item.id)}
                      className="p-1.5 rounded-lg text-zinc-500 hover:text-red-400 cursor-pointer"
                      title="Quitar de esta playlist"
                    >
                      <Trash2 className="w-3.5 h-3.5" />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const ArchivePlayerShell: React.FC = () => {
  const [activeView, setActiveView] = useState<AppView>('explore');
  const [searchQuery, setSearchQuery] = useState<string>('');
  const [liveSearchResults, setLiveSearchResults] = useState<MediaItem[]>([]);
  const [lastLiveQuery, setLastLiveQuery] = useState<string>('');
  const [isSearchingArchive, setIsSearchingArchive] = useState<boolean>(false);

  const handleLiveSearchResults = (items: MediaItem[], query: string) => {
    setLiveSearchResults(items);
    setLastLiveQuery(query);
  };

  const renderActiveView = () => {
    switch (activeView) {
      case 'explore':
        return (
          <ExploreView
            searchQuery={searchQuery}
            liveSearchResults={liveSearchResults}
            lastLiveQuery={lastLiveQuery}
            isSearchingArchive={isSearchingArchive}
            onSelectView={setActiveView}
          />
        );
      case 'artists':
        return <ArtistsAlbumsView mode="artists" />;
      case 'albums':
        return <ArtistsAlbumsView mode="albums" />;
      case 'videos':
        return <ArtistsAlbumsView mode="videos" />;
      case 'ai-curator':
        return <AICuratorView />;
      case 'playlists':
        return <LibraryAndOfflineView mode="playlists" />;
      case 'favorites':
        return <LibraryAndOfflineView mode="favorites" />;
      case 'offline':
        return <LibraryAndOfflineView mode="offline" />;
      default:
        return null;
    }
  };

  return (
    <div className="min-h-screen bg-[#090a0f] text-zinc-100 flex flex-col lg:flex-row overflow-x-hidden">
      {/* Navegación Lateral Desktop */}
      <Sidebar activeView={activeView} onSelectView={setActiveView} />

      {/* Área Principal */}
      <div className="flex-1 flex flex-col min-w-0 pb-36 lg:pb-24">
        <Header
          activeView={activeView}
          onSelectView={setActiveView}
          searchQuery={searchQuery}
          onSearchQueryChange={setSearchQuery}
          onLiveSearchResults={handleLiveSearchResults}
          isSearchingArchive={isSearchingArchive}
          setIsSearchingArchive={setIsSearchingArchive}
        />

        <main className="flex-1 px-4 sm:px-6 lg:px-8 pt-6 max-w-screen-2xl w-full mx-auto">
          {renderActiveView()}
        </main>
      </div>

      {/* Panel de Contexto Histórico y Licencias */}
      <LinerNotesDrawer />

      {/* Reproductor Unificado Persistente (Audio + Video + Proyector Cine Mudo) */}
      <UnifiedPlayerBar />

      {/* Navegación Inferior Mobile */}
      <MobileNav activeView={activeView} onSelectView={setActiveView} />
    </div>
  );
};

function App() {
  return (
    <PlayerProvider>
      <ArchivePlayerShell />
    </PlayerProvider>
  );
}




const rootEl = document.getElementById('root');
if (rootEl) { ReactDOM.createRoot(rootEl).render(<App />); }
